{
  "event"              : "ui_interaction",                                                         # Nombre fijo del evento
  "ui_location"        : "content_body",                                                           # Dónde está el elemento
  "ui_element"         : "button",                                                                 # Qué es el elemento
  "ui_action"          : "submit",                                                                 # Qué hace (open_modal, navigation, etc.)
  "ui_label"           : "{{nombre_del_boton}}",                                                   # Identificador único o texto del botón presionado.
  "ui_hierarchy"       : "home > {{Nivel del cuestionario}} > pregunta_{n_pregunta}",              # Identificador semantico de la seccion donde se ubica. Para el nivel del evento son 3 (personalidad,intereses y habilidades) y el n_pregunta debe ir con zero-padding (ej. pregunta_01).
  "path_location"      : "{{path_actual_del_evento}}",                                             # Path de donde se mide el evento.
  "data_collected"     : "{{pregunta_y_respuesta}}",                                               # Se guarda la pregunta y respuesta (ej. "pregunta: [Pregunta] | respuesta: [Respuesta]").
}