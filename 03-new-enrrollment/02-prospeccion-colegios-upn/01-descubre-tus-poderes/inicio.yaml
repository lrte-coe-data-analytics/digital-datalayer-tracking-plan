{
  "event"              : "ui_interaction",                           # Nombre fijo del evento
  "ui_location"        : "content_body",                             # Dónde está el elemento
  "ui_element"         : "button",                                   # Qué es el elemento
  "ui_action"          : "click",                                    # Qué hace (open_modal, navigation, etc.)
  "ui_label"           : "{{seccion_actual}}",                       # Identificador único o texto del elemento. Para este caso puede ser 3 (personalidad, intereses y habilidades)
  "ui_hierarchy"       : "home > {{seccion_actual}}",                # Identificador semantico de la seccion donde se úbica. Para el nivel del evento son 3 (personalidad, intereses y habilidades)
  "path_location"      : "{{path_actual_del_evento}}"                # Path de donde se mide el evento.
}