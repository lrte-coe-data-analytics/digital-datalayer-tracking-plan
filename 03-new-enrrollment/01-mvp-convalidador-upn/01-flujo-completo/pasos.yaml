{
  "event"            : "ui_interaction",                    # Nombre fijo del evento
  "ui_location"      : "form_container",                    # Dónde está el elemento
  "ui_element"       : "button",                            # Qué es el elemento
  "ui_action"        : "click",                             # Qué hace (open_modal, navigation, etc.)
  "ui_label"         : "{{text formulario}}",               # Identificador único o texto del elemento. (En este caso puede ser subir silabus, empezar analisis)
  "ui_hierarchy"     : "home > flujo_completo",             # Identificador semantico de la seccion donde se ubica. En este caso flujo express.
  "path_location"    : "/",                                 # Path de donde se mide el evento.
}


