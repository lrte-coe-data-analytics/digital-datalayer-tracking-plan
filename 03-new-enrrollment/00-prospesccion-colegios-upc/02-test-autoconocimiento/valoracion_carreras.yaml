{
  "event"              : "ui_interaction",                                      # Nombre fijo del evento
  "ui_location"        : "content_body",                                        # Dónde está el elemento
  "ui_element"         : "button",                                              # Qué es el elemento
  "ui_action"          : "click",                                               # Qué hace (open_modal, navigation, etc.)
  "ui_label"           : "si|no",                                               # Identificador único o texto del elemento, depende de la pregunta.(En este caso es Si o NO)
  "ui_hierarchy"       : "home > autoconocimiento > valoracion_carreras",       # Identificador semantico de la seccion donde se ubica.(En este caso es Autoconocimiento > Valoracion de carreras)
  "path_location"      : "{{path_actual_del_evento}}",                          # Path de donde se mide el evento.
  "data_collected"     : "{{data_recopilada}}",                                 # Aqui debe ir la carrera que es aceptada o rechazada.(Odontologia, Derecho, etc)
}