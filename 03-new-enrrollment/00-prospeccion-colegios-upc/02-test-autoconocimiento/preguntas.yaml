{
  "event"              : "ui_interaction",                             # Nombre fijo del evento
  "ui_location"        : "content_body",                               # Dónde está el elemento
  "ui_element"         : "button",                                     # Qué es el elemento
  "ui_action"          : "submit",                                     # Qué hace (open_modal, navigation, etc.)
  "ui_label"           : "{{numero_de_pregunta}}",                     # Identificador único o texto del elemento, en este caso debe ir el número de la pregunta que se responde con zero-padding (Ejemplo: 01, 02... hasta 23).
  "ui_hierarchy"       : "home > autoconocimiento > pregunta_{n_pregunta}", # Identificador semántico de la seccion donde se ubica (el evento es idéntico en cada vista de pregunta, n_pregunta debe ir con zero-padding, ej. pregunta_01).
  "path_location"      : "{{path_actual_del_evento}}",                 # Path de donde se mide el evento.
  "data_collected"     : "{{data_recopilada}}"                         # Se recomienda guardar un diccionario con nro_pregunta, pregunta y respuesta.
}