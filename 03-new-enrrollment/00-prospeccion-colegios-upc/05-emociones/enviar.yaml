  "ui_hierarchy"    : "home > emociones",                            # Identificador semantico de la seccion donde se ubica.(En este caso se home > emociones)
  "path_location"   : "/medidor-de-emociones" ,                      # Path de donde se mide el evento.
  "data_collected"  : "{{data_recopilada}}"                          # Opción seleccionada por el usuario. Valores posibles: "Me emociona, ¡Quiero estudiar en la UPC!", "Me emociona, pero estoy entre otras universidades", "No es lo que estoy buscando, me identifico más con otras universidades".
